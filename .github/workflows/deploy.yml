# main에 merge되면 GitHub Pages로 배포합니다.
# 빌드는 없고, 비밀 값으로 src/secrets.js 만 만들어 넣습니다(레포에는 남지 않음).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Write src/secrets.js from repository secrets
        env:
          LEADERBOARD_URL: ${{ secrets.LEADERBOARD_URL }}
          LEADERBOARD_ANON_KEY: ${{ secrets.LEADERBOARD_ANON_KEY }}
        run: |
          cat > src/secrets.js <<JS
          const SECRETS = {
            LEADERBOARD_URL: '${LEADERBOARD_URL}',
            LEADERBOARD_ANON_KEY: '${LEADERBOARD_ANON_KEY}'
          };
          JS

      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src _site/
          rm -f _site/src/secrets.example.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
