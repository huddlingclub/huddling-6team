<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F0E3">
<title>오늘도 다짐</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<!--
  임시 시작 화면입니다. 게임 화면 작업이 PR로 들어오면 이 파일을 교체해 주세요.
  지금은 config.js가 잘 읽히는지만 확인합니다.
-->
<main class="placeholder">
  <h1>오늘도 다짐</h1>
  <p>퇴근길에 쌓인 화를 마늘에 풀고, 끝까지 다진 만큼 오늘의 저녁 메뉴를 받는 게임</p>
  <ol id="levels"></ol>
  <p class="note">준비 중 · 설정값은 <code>src/config.js</code></p>
</main>

<script src="src/config.js"></script>
<script>
  // config.js 확인용 (게임 코드가 들어오면 삭제)
  const list = document.getElementById('levels');
  for (const lv of CONFIG.LEVELS) {
    const li = document.createElement('li');
    li.textContent = `LV${lv.level} ${lv.name} · ${lv.taps}탭 · ${lv.timeLimit.toFixed(1)}초 · 화 −${lv.relief}`;
    list.appendChild(li);
  }
</script>
</body>
</html>
